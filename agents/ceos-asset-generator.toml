# CEOS-managed agent; installed by Codex Engineering OS.
name = "ceos_asset_generator"
description = "Use for bounded production-asset generation and integration after an art canon, asset manifest, generation brief, and acceptance criteria are defined."
model = "gpt-5.6-terra"
